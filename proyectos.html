<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos — Fundación Loyola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    /* ── Layout ── */
    .page-wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

    .page-title { font-size: 22px; font-weight: 800; color: #0D6835; margin-bottom: 4px; }
    .page-subtitle { font-size: 13px; color: #5a7a5a; margin-bottom: 24px; }

    /* ── Stats bar ── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: #fff;
      border-radius: 10px;
      padding: 16px 20px;
      border-left: 4px solid #ccc;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .stat-card.total   { border-color: #0D6835; }
    .stat-card.nuevo   { border-color: #3498db; }
    .stat-card.aprobado{ border-color: #27ae60; }
    .stat-card.rechazado{ border-color: #e74c3c; }
    .stat-card.cerrado { border-color: #95a5a6; }
    .stat-num { font-size: 28px; font-weight: 800; color: #0D6835; }
    .stat-card.nuevo    .stat-num { color: #3498db; }
    .stat-card.aprobado .stat-num { color: #27ae60; }
    .stat-card.rechazado .stat-num { color: #e74c3c; }
    .stat-card.cerrado  .stat-num { color: #95a5a6; }
    .stat-label { font-size: 12px; color: #5a7a5a; font-weight: 600; margin-top: 2px; }

    /* ── Filters ── */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }
    .filter-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 2px solid #dde8e3;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #5a7a5a;
      transition: all .2s;
    }
    .filter-btn:hover { border-color: #0D6835; color: #0D6835; }
    .filter-btn.active { background: #0D6835; border-color: #0D6835; color: #fff; }
    .filter-btn.active.nuevo    { background: #3498db; border-color: #3498db; }
    .filter-btn.active.aprobado { background: #27ae60; border-color: #27ae60; }
    .filter-btn.active.rechazado{ background: #e74c3c; border-color: #e74c3c; }
    .filter-btn.active.cerrado  { background: #95a5a6; border-color: #95a5a6; }
    .search-input {
      margin-left: auto;
      padding: 7px 14px;
      border: 2px solid #dde8e3;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
      width: 220px;
      transition: border-color .2s;
    }
    .search-input:focus { border-color: #0D6835; }

    /* ── Project cards ── */
    .projects-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .project-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
      border: 1px solid #e8f0e8;
      padding: 18px 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      transition: box-shadow .2s;
    }
    .project-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.12); }

    .project-card .card-left { min-width: 0; }
    .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }

    .badge-tipo {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .badge-tipo.vigente   { background: #e8f5e9; color: #1b5e20; }
    .badge-tipo.financiar { background: #fff3e0; color: #e65100; }

    .badge-status {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .badge-status.nuevo    { background: #e3f2fd; color: #1565c0; }
    .badge-status.aprobado { background: #e8f5e9; color: #1b5e20; }
    .badge-status.rechazado{ background: #ffebee; color: #b71c1c; }
    .badge-status.cerrado  { background: #f5f5f5; color: #616161; }

    .project-name { font-size: 15px; font-weight: 700; color: #1a2e1a; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-detail { font-size: 12.5px; color: #5a7a5a; display: flex; flex-wrap: wrap; gap: 14px; }
    .project-detail span { display: flex; align-items: center; gap: 4px; }

    /* ── Status selector ── */
    .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .status-select {
      padding: 7px 12px;
      border-radius: 8px;
      border: 2px solid #dde8e3;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      background: #f8faf9;
      color: #1a2e1a;
      transition: border-color .2s;
      min-width: 140px;
    }
    .status-select:focus { border-color: #0D6835; }
    .status-select.nuevo    { border-color: #3498db; background: #e3f2fd; color: #1565c0; }
    .status-select.aprobado { border-color: #27ae60; background: #e8f5e9; color: #1b5e20; }
    .status-select.rechazado{ border-color: #e74c3c; background: #ffebee; color: #b71c1c; }
    .status-select.cerrado  { border-color: #95a5a6; background: #f5f5f5; color: #616161; }

    .save-indicator {
      font-size: 11px;
      color: #27ae60;
      font-weight: 600;
      opacity: 0;
      transition: opacity .3s;
      height: 16px;
    }
    .save-indicator.visible { opacity: 1; }

    /* ── Empty / loading ── */
    .empty-state { text-align: center; padding: 60px 20px; color: #5a7a5a; }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    .loading { text-align: center; padding: 40px; color: #5a7a5a; font-size: 14px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #0D6835;
      color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      transition: transform .3s;
      z-index: 999;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: #e74c3c; }

    @media (max-width: 600px) {
      .project-card { grid-template-columns: 1fr; }
      .card-right { flex-direction: row; align-items: center; }
      .search-input { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>

  <nav>

      <span class="nav-icon">📋</span><span>Datos de la Obra</span>

    <a href="index.html#calendario" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;color:rgba(255,255,255,.85);text-decoration:none;font-size:13px;font-weight:600;transition:background .2s" onmouseover="this.style.background='rgba(255,255,255,.12)'" onmouseout="this.style.background='transparent'">
      <span class="nav-icon">📅</span><span>Fechas</span>
    </a>
    <a href="index.html#documentos" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;color:rgba(255,255,255,.85);text-decoration:none;font-size:13px;font-weight:600;transition:background .2s" onmouseover="this.style.background='rgba(255,255,255,.12)'" onmouseout="this.style.background='transparent'">

<div class="main">
  <div class="page-wrap">
    <h1 class="page-title">Resumen de Proyectos</h1>
    <p class="page-subtitle" id="obra-subtitle">Cargando obra...</p>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card total">
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card nuevo">
        <div class="stat-num" id="stat-nuevo">—</div>
        <div class="stat-label">Nuevo</div>
      </div>
      <div class="stat-card aprobado">
        <div class="stat-num" id="stat-aprobado">—</div>
        <div class="stat-label">Aprobado</div>
      </div>
      <div class="stat-card rechazado">
        <div class="stat-num" id="stat-rechazado">—</div>
        <div class="stat-label">Rechazado</div>
      </div>
      <div class="stat-card cerrado">
        <div class="stat-num" id="stat-cerrado">—</div>
        <div class="stat-label">Cerrado</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" data-filter="todos" onclick="setFilter('todos', this)">Todos</button>
      <button class="filter-btn nuevo"    data-filter="nuevo"    onclick="setFilter('nuevo', this)">🔵 Nuevo</button>
      <button class="filter-btn aprobado" data-filter="aprobado" onclick="setFilter('aprobado', this)">🟢 Aprobado</button>
      <button class="filter-btn rechazado"data-filter="rechazado"onclick="setFilter('rechazado', this)">🔴 Rechazado</button>
      <button class="filter-btn cerrado"  data-filter="cerrado"  onclick="setFilter('cerrado', this)">⚪ Cerrado</button>
      <button class="filter-btn"          data-filter="vigente"  onclick="setFilter('vigente', this)">📂 Vigentes</button>
      <button class="filter-btn"          data-filter="financiar"onclick="setFilter('financiar', this)">🔍 Por Financiar</button>
      <input type="text" class="search-input" id="search-input" placeholder="🔍 Buscar proyecto..." oninput="renderCards()">
    </div>

    <!-- Cards -->
    <div class="projects-grid" id="projects-grid">
      <div class="loading">Cargando proyectos...</div>
    </div>

  <div class="toast" id="toast"></div>

  <!-- Modal detalle proyecto -->
  <div class="modal-overlay" id="modal-detalle-proy" onclick="if(event.target===this)cerrarDetalleProy()">
    <div class="modal" style="max-width:700px">
      <button class="modal-close" onclick="cerrarDetalleProy()">✕</button>
      <div id="modal-detalle-proy-content"></div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    let allProjects = [];
    let currentFilter = 'todos';
    let _session = {};

    // ── Init ──────────────────────────────────────────
    async function init() {
      _session = JSON.parse(sessionStorage.getItem('usuarioActual') || '{}');
      if (!_session.token) { window.location.href = 'Inicio.html'; return; }

      const obraLabel = _session.obraNombre || _session.nombre || _session.usuario || '';
      const sidebarLabel = document.getElementById('obra-label-sidebar');
      if (sidebarLabel) sidebarLabel.textContent = obraLabel;

      const obraId = _session.obraId;
      if (!obraId) {
        document.getElementById('projects-grid').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><p>No hay obra asignada a este usuario.</p></div>';
        return;
      }

      document.getElementById('obra-subtitle').textContent = _session.obraNombre || 'Obra asignada';

      try {
        const proyectos = await API.proyectos.getAll(obraId);
        // Obra users only see projects they created; admin sees all
        allProjects = _session.rol === 'admin'
          ? proyectos
          : proyectos.filter(p => p.creado_por === _session.id);
        renderStats();
        renderCards();
      } catch (e) {
        document.getElementById('projects-grid').innerHTML =
          `<div class="empty-state"><div class="icon">❌</div><p>Error al cargar proyectos: ${e.message}</p></div>`;
      }
    }

    // ── Stats ─────────────────────────────────────────
    function renderStats() {
      const counts = { nuevo: 0, aprobado: 0, rechazado: 0, cerrado: 0 };
      allProjects.forEach(p => { if (counts[p.status] !== undefined) counts[p.status]++; });
      document.getElementById('stat-total').textContent    = allProjects.length;
      document.getElementById('stat-nuevo').textContent    = counts.nuevo;
      document.getElementById('stat-aprobado').textContent = counts.aprobado;
      document.getElementById('stat-rechazado').textContent= counts.rechazado;
      document.getElementById('stat-cerrado').textContent  = counts.cerrado;
    }

    // ── Filter ────────────────────────────────────────
    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards();
    }

    // ── Render ────────────────────────────────────────
    function renderCards() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const grid  = document.getElementById('projects-grid');

      let list = allProjects.filter(p => {
        const datos = p.datos || {};
        const nombre = (datos.nombre || '').toLowerCase();
        const causa  = (datos.causa  || '').toLowerCase();

        const matchSearch = !query || nombre.includes(query) || causa.includes(query);
        const matchFilter =
          currentFilter === 'todos'    ? true :
          currentFilter === 'vigente'  ? p.tipo === 'vigente' :
          currentFilter === 'financiar'? p.tipo === 'financiar' :
          p.status === currentFilter;

        return matchSearch && matchFilter;
      });

      if (list.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>No se encontraron proyectos con ese filtro.</p></div>';
        return;
      }

      const statusColors = { nuevo:'#5b8dee', aprobado:'#27ae60', rechazado:'#e74c3c', cerrado:'#7f8c8d' };
      grid.innerHTML = `
        <div style="overflow:auto">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
              <tr style="background:#f8faf9;border-bottom:2px solid #dde8e3">
                <th style="padding:10px 14px;text-align:left;font-weight:700;color:#5a7a5a;white-space:nowrap">Tipo</th>
                <th style="padding:10px 14px;text-align:left;font-weight:700;color:#5a7a5a">Proyecto</th>
                <th style="padding:10px 14px;text-align:left;font-weight:700;color:#5a7a5a;white-space:nowrap">Responsable</th>
                <th style="padding:10px 14px;text-align:left;font-weight:700;color:#5a7a5a;white-space:nowrap">Fecha</th>
                <th style="padding:10px 14px;text-align:left;font-weight:700;color:#5a7a5a;white-space:nowrap">Status</th>
                <th style="padding:10px 14px;text-align:left;font-weight:700;color:#5a7a5a;white-space:nowrap">Cambiar status</th>
                <th style="padding:10px 14px"></th>
                <th style="padding:10px 14px;text-align:left;font-weight:700;color:#5a7a5a;white-space:nowrap">Imprimir</th>
              </tr>
            </thead>
            <tbody>
              ${list.map(p => {
                const d = p.datos || {};
                const status = p.status || 'nuevo';
                const fecha = p.fecha_registro ? new Date(p.fecha_registro).toLocaleDateString('es-MX') : '—';
                const color = statusColors[status] || '#95a5a6';
                const tipoBg = p.tipo === 'vigente' ? '#e8f5e9' : '#fff3e0';
                const tipoColor = p.tipo === 'vigente' ? '#1b5e20' : '#e65100';
                const opts = ['nuevo','aprobado','rechazado','cerrado']
                  .map(s => `<option value="${s}"${p.status===s?' selected':''}>${labelStatus(s)}</option>`).join('');
                return `<tr style="border-bottom:1px solid #eef3ee;transition:background .15s" onmouseover="this.style.background='#f8faf9'" onmouseout="this.style.background=''">
                  <td style="padding:10px 14px;white-space:nowrap">
                    <span style="background:${tipoBg};color:${tipoColor};font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;text-transform:uppercase">${p.tipo === 'vigente' ? '📂 Vigente' : '🔍 Por Financiar'}</span>
                  </td>
                  <td style="padding:10px 14px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#1a2e1a">${d.nombre || 'Sin nombre'}</td>
                  <td style="padding:10px 14px;color:#5a7a5a;white-space:nowrap">${d.responsable || '—'}</td>
                  <td style="padding:10px 14px;color:#5a7a5a;white-space:nowrap">${fecha}</td>
                  <td style="padding:10px 14px;white-space:nowrap">
                    <span id="ind-${p.id}" style="background:${color};color:#fff;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;display:inline-block">${status}</span>
                  </td>
                  <td style="padding:10px 14px;white-space:nowrap">
                    <select style="font-size:12px;padding:5px 8px;border:1.5px solid #dde8e3;border-radius:8px" onchange="changeStatus(${p.id}, this)">
                      ${opts}
                    </select>
                  </td>
                  <td style="padding:10px 14px;white-space:nowrap;display:flex;gap:6px">
                    <button onclick="verDetalleProyecto(${p.id})" title="Ver detalle" style="background:none;border:1.5px solid #b8d9c5;border-radius:8px;padding:4px 10px;cursor:pointer;color:#0D6835"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    <button onclick="imprimirProyectoPDF(${p.id})" title="Imprimir PDF" style="background:none;border:1.5px solid #b8d9c5;border-radius:8px;padding:4px 10px;cursor:pointer;color:#0D6835"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function labelStatus(s) {
      return { nuevo: '🔵 Nuevo', aprobado: '🟢 Aprobado', rechazado: '🔴 Rechazado', cerrado: '⚪ Cerrado' }[s] || s;
    }

    // ── Change status ─────────────────────────────────
    async function changeStatus(id, select) {
      const newStatus = select.value;
      const statusColors = { nuevo:'#5b8dee', aprobado:'#27ae60', rechazado:'#e74c3c', cerrado:'#7f8c8d' };

      try {
        await API.proyectos.updateStatus(id, newStatus);

        // Update local data
        const proj = allProjects.find(p => p.id === id);
        if (proj) proj.status = newStatus;

        // Update badge in table row
        const badge = document.getElementById(`ind-${id}`);
        if (badge) {
          badge.textContent = newStatus;
          badge.style.background = statusColors[newStatus] || '#95a5a6';
        }

        renderStats();
        showToast(`Status actualizado a "${newStatus}"`);
      } catch (e) {
        showToast('Error al actualizar: ' + e.message, true);
      }
    }

    // ── Toast ─────────────────────────────────────────
    function showToast(msg, error = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (error ? ' error' : '');
      setTimeout(() => t.className = 'toast', 2500);
    }

    // ── Ver detalle ───────────────────────────────────
    function verDetalleProyecto(id) {
      const p = allProjects.find(x => x.id === id);
      if (!p) return;
      const d = p.datos || {};
      const status = p.status || 'nuevo';
      const fecha  = p.fecha_registro ? new Date(p.fecha_registro).toLocaleDateString('es-MX', { dateStyle: 'long' }) : '—';
      const statusColors = { nuevo:'#3498db', aprobado:'#27ae60', rechazado:'#e74c3c', cerrado:'#95a5a6' };
      const color = statusColors[status] || '#95a5a6';

      function row(label, value) {
        if (!value && value !== 0) return '';
        return `<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f0f5f0">
          <span style="min-width:160px;font-size:12px;font-weight:700;color:#5a7a5a;text-transform:uppercase;letter-spacing:.4px">${label}</span>
          <span style="font-size:13px;color:#1a2e1a;flex:1">${value}</span>
        </div>`;
      }

      document.getElementById('modal-detalle-proy-content').innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap">
          <span style="background:${p.tipo==='vigente'?'#e8f5e9':'#fff3e0'};color:${p.tipo==='vigente'?'#1b5e20':'#e65100'};padding:3px 12px;border-radius:12px;font-size:12px;font-weight:700;text-transform:uppercase">${p.tipo === 'vigente' ? '📂 Vigente' : '🔍 Por Financiar'}</span>
          <span style="background:${color};color:#fff;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:700;text-transform:uppercase">${status}</span>
        </div>
        <h3 style="font-size:18px;font-weight:800;color:#0D6835;margin:0 0 20px">${d.nombre || 'Sin nombre'}</h3>
        <div>
          ${row('Causa / Categoría', d.causa)}
          ${row('Temporalidad', d.temporalidad)}
          ${row('Responsable', d.responsable)}
          ${row('Correo', d.correo)}
          ${row('Lugar de desarrollo', d.lugar)}
          ${row('Objetivo', d.objetivo)}
          ${row('Descripción', d.descripcion)}
          ${row('Realidad a responder', d.realidad)}
          ${row('Resultados esperados', d.resultados)}
          ${row('Objetivos estratégicos', d['obj-estrategico'])}
          ${row('Beneficiados directos', d.beneficiadosDirectos ? Number(d.beneficiadosDirectos).toLocaleString('es-MX') : null)}
          ${row('Monto del proyecto', d.presupuesto ? '$' + Number(d.presupuesto).toLocaleString('es-MX') + ' MXN' : null)}
          ${row('Monto requerido', d.montoRequerido ? '$' + Number(d.montoRequerido).toLocaleString('es-MX') + ' MXN' : null)}
          ${row('Fecha de registro', fecha)}
        </div>
        <div style="text-align:right;margin-top:20px">
          <button onclick="cerrarDetalleProy()" style="padding:9px 24px;background:#0D6835;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">Cerrar</button>
        </div>`;
      document.getElementById('modal-detalle-proy').classList.add('open');
    }

    function cerrarDetalleProy() {
      document.getElementById('modal-detalle-proy').classList.remove('open');
    }

    async function cerrarSesion() {
      if (!confirm('¿Deseas cerrar sesión?')) return;
      try { await API.auth.logout(); } catch { /* silent */ }
      sessionStorage.removeItem('usuarioActual');
      window.location.href = 'Inicio.html';
    }

    function imprimirProyectoPDF(id) {
      const p = allProjects.find(x => x.id === id);
      if (!p) return;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });

      const d      = p.datos || {};
      const nombre = d.nombre || d.titulo || d.proyecto || 'Sin nombre';
      const obra   = _session.obraNombre || '—';
      const fecha  = p.fecha_registro ? new Date(p.fecha_registro).toLocaleDateString('es-MX', { dateStyle: 'long' }) : '—';
      const statusColors = { nuevo:[91,141,238], aprobado:[39,174,96], rechazado:[231,76,60], cerrado:[127,140,141] };
      const [sr,sg,sb] = statusColors[p.status] || [149,165,166];

      const GREEN = [13,104,53], LGRAY = [245,247,245], MGRAY = [120,140,120], BLACK = [30,46,30];
      const W = 215.9, MARGIN = 14, COL_W = 55;

      // Encabezado
      doc.setFillColor(...GREEN);
      doc.rect(0, 0, W, 22, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(13);
      doc.setTextColor(255,255,255);
      doc.text('FUNDACIÓN LOYOLA', MARGIN, 10);
      doc.setFontSize(8);
      doc.setFont('helvetica', 'normal');
      doc.text('Sistema de Sondeo SNF — Reporte de Proyecto', MARGIN, 16);

      // Badges
      let y = 30;
      const tipoBg  = p.tipo === 'vigente' ? [232,245,233] : [255,243,224];
      const tipoTxt = p.tipo === 'vigente' ? [27,94,32]    : [230,81,0];
      doc.setFillColor(...tipoBg);
      doc.roundedRect(MARGIN, y - 4, 28, 7, 2, 2, 'F');
      doc.setTextColor(...tipoTxt);
      doc.setFontSize(7.5);
      doc.setFont('helvetica', 'bold');
      doc.text((p.tipo === 'vigente' ? 'VIGENTE' : 'POR FINANCIAR'), MARGIN + 14, y, { align: 'center' });

      doc.setFillColor(sr, sg, sb);
      doc.roundedRect(MARGIN + 32, y - 4, 22, 7, 2, 2, 'F');
      doc.setTextColor(255,255,255);
      doc.text((p.status || '').toUpperCase(), MARGIN + 43, y, { align: 'center' });

      doc.setTextColor(...MGRAY);
      doc.setFontSize(7.5);
      doc.setFont('helvetica', 'normal');
      doc.text('Obra: ' + obra, W - MARGIN, y, { align: 'right' });

      // Nombre
      y += 10;
      doc.setTextColor(...GREEN);
      doc.setFontSize(14);
      doc.setFont('helvetica', 'bold');
      const nombreLines = doc.splitTextToSize(nombre, W - MARGIN * 2);
      doc.text(nombreLines, MARGIN, y);
      y += nombreLines.length * 6 + 4;

      doc.setDrawColor(...GREEN);
      doc.setLineWidth(0.5);
      doc.line(MARGIN, y, W - MARGIN, y);
      y += 6;

      function addRow(label, value) {
        if (!value && value !== 0) return;
        const strVal   = String(value);
        const valLines = doc.splitTextToSize(strVal, W - MARGIN - COL_W - 4);
        const rowH     = Math.max(7, valLines.length * 5 + 3);
        if (y + rowH > 260) { doc.addPage(); y = 16; }
        if (addRow._alt) {
          doc.setFillColor(...LGRAY);
          doc.rect(MARGIN, y - 4, W - MARGIN * 2, rowH, 'F');
        }
        addRow._alt = !addRow._alt;
        doc.setTextColor(...MGRAY);
        doc.setFontSize(7.5);
        doc.setFont('helvetica', 'bold');
        doc.text(label.toUpperCase(), MARGIN + 1, y);
        doc.setTextColor(...BLACK);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8.5);
        doc.text(valLines, MARGIN + COL_W, y);
        y += rowH;
      }
      addRow._alt = false;

      function sectionTitle(title) {
        if (y + 10 > 260) { doc.addPage(); y = 16; }
        doc.setTextColor(...GREEN);
        doc.setFontSize(9);
        doc.setFont('helvetica', 'bold');
        doc.text(title, MARGIN, y);
        y += 5;
      }

      sectionTitle('INFORMACIÓN GENERAL');
      addRow('Fecha de registro',    fecha);
      addRow('Causa / Categoría',    d.causa);
      addRow('Temporalidad',         d.temporalidad);
      addRow('Responsable',          d.responsable);
      addRow('Correo',               d.correo);
      addRow('Lugar de desarrollo',  d.lugar);

      y += 3;
      sectionTitle('DESCRIPCIÓN DEL PROYECTO');
      addRow('Objetivo',             d.objetivo);
      addRow('Descripción',          d.descripcion);
      addRow('Realidad a responder', d.realidad);
      addRow('Resultados esperados', d.resultados);
      addRow('Obj. estratégicos',    d['obj-estrategico']);

      y += 3;
      sectionTitle('IMPACTO Y PRESUPUESTO');
      addRow('Beneficiados directos',
        d.beneficiadosDirectos ? Number(d.beneficiadosDirectos).toLocaleString('es-MX') + ' personas' : null);
      addRow('Monto del proyecto',
        d.presupuesto    ? '$' + Number(d.presupuesto).toLocaleString('es-MX')    + ' MXN' : null);
      addRow('Monto requerido',
        d.montoRequerido ? '$' + Number(d.montoRequerido).toLocaleString('es-MX') + ' MXN' : null);

      // Pie de página
      const pageCount = doc.getNumberOfPages();
      for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        doc.setFillColor(...GREEN);
        doc.rect(0, 272, W, 8, 'F');
        doc.setTextColor(255,255,255);
        doc.setFontSize(7);
        doc.setFont('helvetica', 'normal');
        doc.text('Fundación Loyola — Documento generado el ' + new Date().toLocaleDateString('es-MX', { dateStyle: 'long' }), MARGIN, 277.5);
        doc.text('Pág. ' + i + ' / ' + pageCount, W - MARGIN, 277.5, { align: 'right' });
      }

      doc.save('proyecto_' + nombre.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase() + '.pdf');
    }

    init();
  </script>
</body>
</html>
