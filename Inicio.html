<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de Sesión — Fundación Loyola">
  <title>Login — Fundación Loyola</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- Sistema de diseño unificado -->
  <link rel="stylesheet" href="assets/css/styles.css">

  <style>
    /* Override body para esta página (no usa sidebar layout) */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    /* Slideshow de fondo */
    .slideshow-container {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .slide.active { opacity: 1; }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.52);
      z-index: 1;
    }

    /* Tarjeta de login */
    .login-card {
      background: rgba(255,255,255,0.97);
      padding: 45px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      text-align: center;
      border-top: 8px solid var(--green-dark);
      width: 100%;
      max-width: 440px;
      z-index: 2;
      position: relative;
      animation: fadeInUp 0.6s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-card img {
      width: 150px;
      margin-bottom: 22px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .login-card h2 {
      color: var(--green-dark);
      margin-bottom: 24px;
      font-size: 26px;
      font-weight: 700;
      font-family: var(--font-display);
    }

    .login-card input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 2px solid var(--green-border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: all var(--t);
      font-size: 15px;
      font-family: var(--font-body);
      background: var(--white);
    }
    .login-card input:focus {
      border-color: var(--green-dark);
      box-shadow: 0 0 0 3px rgba(13,104,53,0.1);
    }

    .login-card .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      transition: all var(--t);
      margin-top: 8px;
      font-family: var(--font-body);
    }
    .login-card .btn-login:hover {
      background: linear-gradient(135deg, var(--green-mid), var(--green-dark));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(13,104,53,0.3);
    }
    .login-card .btn-login:active { transform: translateY(0); }
    .login-card .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .forgot-link {
      display: block;
      margin-top: 14px;
      color: var(--green-dark);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all var(--t);
    }
    .forgot-link:hover { color: var(--green-mid); text-decoration: underline; }

    #mensaje {
      color: var(--danger);
      margin-top: 10px;
      font-size: 13.5px;
      min-height: 20px;
      font-weight: 600;
    }
    #mensaje.success { color: var(--success); }

    @media (max-width: 480px) {
      .login-card { padding: 28px 18px; margin: 16px; }
    }
  </style>
</head>
<body>

  <!-- Fondo animado -->
  <div class="slideshow-container">
    <div class="slide active" style="background-image: url('assets/images/imagen1.jpg');"></div>
    <div class="slide"        style="background-image: url('assets/images/image2.jpg');"></div>
    <div class="slide"        style="background-image: url('assets/images/image3.jpg');"></div>
    <div class="slide"        style="background-image: url('assets/images/image4.jpg');"></div>
  </div>
  <div class="overlay"></div>

  <!-- Tarjeta de login -->
  <div class="login-card">
    <img src="assets/images/logo_oficial_2021_page-0001.jpg" alt="Logo Fundación Loyola">
    <h2>Iniciar Sesión</h2>

    <form id="loginForm" autocomplete="on">
      <input
        type="text"
        id="usuario"
        name="usuario"
        placeholder="Usuario"
        required
        autocomplete="username"
        aria-label="Usuario"
      >
      <input
        type="password"
        id="contrasena"
        name="contrasena"
        placeholder="Contraseña"
        required
        autocomplete="current-password"
        aria-label="Contraseña"
      >
      <button type="submit" class="btn-login" id="btn-login">Entrar</button>
    </form>

    <p id="mensaje" role="alert"></p>
    <a href="#" class="forgot-link" onclick="alert('Contacte al administrador del sistema para restablecer su contraseña.');return false;">¿Olvidé mi contraseña?</a>
  </div>

  <script>
    function setMensaje(texto, tipo) {
      const el = document.getElementById('mensaje');
      if (!el) return;
      el.textContent = texto;
      el.className = tipo === 'success' ? 'success' : '';
    }

    async function handleLogin(event) {
      event.preventDefault();
      const btn = document.getElementById('btn-login');
      const usuario    = document.getElementById('usuario').value.trim();
      const contrasena = document.getElementById('contrasena').value;

      if (!usuario || !contrasena) {
        setMensaje('Por favor complete todos los campos', '');
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ Ingresando...';
      setMensaje('', '');

      try {
        const { token, user } = await API.auth.login(usuario, contrasena);
        sessionStorage.setItem('usuarioActual', JSON.stringify({
          token,
          id: user.id,
          usuario: user.usuario,
          rol: user.rol,
          nombre: user.nombre,
          obraId: user.obra_id || null,
          timestamp: new Date().toISOString()
        }));

        setMensaje(`Bienvenido, ${user.nombre || user.usuario}`, 'success');

        setTimeout(() => {
          window.location.href = user.rol === 'admin' ? 'admin_dashboard.html' : 'index.html';
        }, 900);

      } catch (err) {
        setMensaje(err.message || 'Error al iniciar sesión', '');
        document.getElementById('contrasena').value = '';
        document.getElementById('contrasena').focus();
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    }

    // Attach login form
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm') || document.querySelector('form');
      if (form) form.addEventListener('submit', handleLogin);
    });

    /* ─── Slideshow ─────────────────────────────── */
    (function initSlideshow() {
      const slides = document.querySelectorAll('.slide');
      let current  = 0;
      if (slides.length < 2) return;
      setInterval(() => {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
      }, 5000);
    })();
  </script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
</body>
</html>
