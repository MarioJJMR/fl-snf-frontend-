<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de Sesión — Fundación Loyola">
  <title>Login — Fundación Loyola</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">

  <!-- Sistema de diseño unificado -->
  <link rel="stylesheet" href="assets/css/styles.css">

  <style>
    /* Override body para esta página (no usa sidebar layout) */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    /* Slideshow de fondo */
    .slideshow-container {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .slide.active { opacity: 1; }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.52);
      z-index: 1;
    }

    /* Tarjeta de login */
    .login-card {
      background: rgba(255,255,255,0.97);
      padding: 45px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      text-align: center;
      border-top: 8px solid var(--green-dark);
      width: 100%;
      max-width: 440px;
      z-index: 2;
      position: relative;
      animation: fadeInUp 0.6s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-card img {
      width: 150px;
      margin-bottom: 22px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .login-card h2 {
      color: var(--green-dark);
      margin-bottom: 24px;
      font-size: 26px;
      font-weight: 700;
      font-family: var(--font-display);
    }

    .login-card input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 2px solid var(--green-border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: all var(--t);
      font-size: 15px;
      font-family: var(--font-body);
      background: var(--white);
    }
    .login-card input:focus {
      border-color: var(--green-dark);
      box-shadow: 0 0 0 3px rgba(13,104,53,0.1);
    }

    .login-card .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      transition: all var(--t);
      margin-top: 8px;
      font-family: var(--font-body);
    }
    .login-card .btn-login:hover {
      background: linear-gradient(135deg, var(--green-mid), var(--green-dark));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(13,104,53,0.3);
    }
    .login-card .btn-login:active { transform: translateY(0); }
    .login-card .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .forgot-link {
      display: block;
      margin-top: 14px;
      color: var(--green-dark);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all var(--t);
    }
    .forgot-link:hover { color: var(--green-mid); text-decoration: underline; }

    #mensaje {
      color: var(--danger);
      margin-top: 10px;
      font-size: 13.5px;
      min-height: 20px;
      font-weight: 600;
    }
    #mensaje.success { color: var(--success); }

    /* Separador "o" */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 4px;
      color: #999;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    /* Botón Google */
    .btn-google {
      width: 100%;
      padding: 13px 14px;
      background: #fff;
      color: #444;
      border: 2px solid #ddd;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-body);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all var(--t);
      margin-top: 8px;
    }
    .btn-google:hover {
      border-color: #4285F4;
      box-shadow: 0 4px 14px rgba(66,133,244,0.18);
      transform: translateY(-1px);
    }
    .btn-google:active { transform: translateY(0); }
    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-google svg { flex-shrink: 0; }

    @media (max-width: 480px) {
      .login-card { padding: 28px 18px; margin: 16px; }
    }

    /* Modal recuperar contraseña */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
      margin: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      border-top: 6px solid #1c3050;
      position: relative;
      animation: fadeInUp 0.3s ease;
    }
    .modal-box h3 { color: #1c3050; font-size: 20px; font-weight: 900; margin: 0 0 8px; }
    .modal-box p  { font-size: 13.5px; color: #4a5568; margin: 0 0 18px; }
    .modal-box input {
      width: 100%; padding: 13px;
      border: 2px solid #c4d4e8;
      border-radius: 8px; outline: none;
      font-size: 14px; font-family: 'Montserrat', sans-serif;
      transition: border-color 0.2s;
      margin-bottom: 12px;
    }
    .modal-box input:focus { border-color: #1c3050; box-shadow: 0 0 0 3px rgba(28,48,80,0.1); }
    .modal-box .btn-enviar {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #1c3050, #2a4a78);
      color: #fff; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; font-family: 'Montserrat', sans-serif;
      cursor: pointer; transition: all 0.2s;
    }
    .modal-box .btn-enviar:hover    { opacity: 0.9; transform: translateY(-1px); }
    .modal-box .btn-enviar:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .modal-box .btn-cerrar {
      position: absolute; top: 14px; right: 16px;
      background: none; border: none; font-size: 20px;
      cursor: pointer; color: #8a96a8; line-height: 1;
    }
    .modal-box .btn-cerrar:hover { color: #1c3050; }
    #msg-forgot { min-height: 18px; font-size: 13px; font-weight: 700; margin-top: 10px; text-align: center; }
    #msg-forgot.error   { color: #d94040; }
    #msg-forgot.success { color: #27ae60; }

    /* Modal de error de login */
    .modal-error-box { border-top-color: #d94040; }
    .modal-error-box h3 { color: #d94040; }
    .modal-error-box p  { font-size: 14.5px; color: #333; margin: 0 0 22px; }
    .btn-error-ok {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #d94040, #b03030);
      color: #fff; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; font-family: 'Montserrat', sans-serif;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-error-ok:hover { opacity: 0.9; transform: translateY(-1px); }
  </style>
</head>
<body>

  <!-- Fondo animado -->
  <div class="slideshow-container">
    <div class="slide active" style="background-image: url('assets/images/image4.jpg');"></div>
    <div class="slide"        style="background-image: url('assets/images/image5.JPG');"></div>
    <div class="slide"        style="background-image: url('assets/images/image6.JPG');"></div>
    <div class="slide"        style="background-image: url('assets/images/image7.jpg');"></div>
    <div class="slide"        style="background-image: url('assets/images/image8.JPG');"></div>
    <div class="slide"        style="background-image: url('assets/images/image9.jpeg');"></div>
    <div class="slide"        style="background-image: url('assets/images/image10.JPG');"></div>
  </div>
  <div class="overlay"></div>

  <!-- Tarjeta de login -->
  <div class="login-card">
    <img src="assets/images/logo_oficial_2021_page-0001.jpg" alt="Logo Fundación Loyola">
    <h2>Iniciar Sesión</h2>

    <form id="loginForm" autocomplete="on">
      <input
        type="email"
        id="usuario"
        name="usuario"
        placeholder="Correo electrónico"
        required
        autocomplete="email"
        aria-label="Correo electrónico"
      >
      <input
        type="password"
        id="contrasena"
        name="contrasena"
        placeholder="Contraseña"
        required
        autocomplete="current-password"
        aria-label="Contraseña"
      >
      <button type="submit" class="btn-login" id="btn-login">Entrar</button>
    </form>

    <div id="google-login-section">
    <div class="divider">o</div>

    <button type="button" class="btn-google" id="btn-google" onclick="iniciarGoogleLogin()">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.7 2.5 30.2 0 24 0 14.7 0 6.7 5.4 2.7 13.3l7.9 6.1C12.5 13.1 17.8 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/>
        <path fill="#FBBC05" d="M10.6 28.6A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l8-6.2z"/>
        <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-3.6-13.4-8.9l-8 6.2C6.7 42.6 14.7 48 24 48z"/>
      </svg>
      Continuar con Google
    </button>
    </div>

    <p id="mensaje" role="alert"></p>
    <a href="#" class="forgot-link" onclick="abrirForgot();return false;">¿Olvidé mi contraseña?</a>
  </div>

  <!-- Modal: Error de login -->
  <div class="modal-overlay" id="modal-error">
    <div class="modal-box modal-error-box">
      <button class="btn-cerrar" onclick="cerrarError()" title="Cerrar">&times;</button>
      <h3>Error al iniciar sesión</h3>
      <p id="error-msg"></p>
      <button class="btn-error-ok" onclick="cerrarError()">Aceptar</button>
    </div>
  </div>

  <!-- Modal: Recuperar contraseña -->
  <div class="modal-overlay" id="modal-forgot">
    <div class="modal-box">
      <button class="btn-cerrar" onclick="cerrarForgot()" title="Cerrar">&times;</button>
      <h3>Recuperar Contraseña</h3>
      <p>Ingresa tu correo electrónico y recibirás un enlace para restablecer tu contraseña.</p>
      <input type="email" id="forgot-email" placeholder="tu@correo.com" autocomplete="email">
      <button class="btn-enviar" id="btn-forgot" onclick="enviarForgot()">Enviar enlace</button>
      <p id="msg-forgot"></p>
    </div>
  </div>

  <!-- Modal: Verificación en dos pasos (2FA) -->
  <div class="modal-overlay" id="modal-2fa">
    <div class="modal-box">
      <button class="btn-cerrar" onclick="cerrar2fa()" title="Cerrar">&times;</button>
      <h3>Verificación en dos pasos</h3>
      <p>Enviamos un código de 6 dígitos a tu correo. Ingrésalo para continuar.</p>
      <input type="text" id="codigo-2fa" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" style="text-align:center;letter-spacing:8px;font-size:20px;font-weight:700">
      <button class="btn-enviar" id="btn-verificar-2fa" onclick="verificarCodigo2fa()">Verificar</button>
      <p id="msg-2fa"></p>
      <p style="text-align:center;margin-top:14px">
        <a href="#" class="forgot-link" id="btn-reenviar-2fa" onclick="reenviarCodigo2fa();return false;">Reenviar código</a>
      </p>
    </div>
  </div>

  <script>
    function setMensaje(texto, tipo) {
      const el = document.getElementById('mensaje');
      if (!el) return;
      el.textContent = texto;
      el.className = tipo === 'success' ? 'success' : '';
    }

    function showErrorPopup(msg) {
      document.getElementById('error-msg').textContent = msg;
      document.getElementById('modal-error').classList.add('open');
    }
    function cerrarError() {
      document.getElementById('modal-error').classList.remove('open');
    }

    // Guarda la sesión y redirige — compartido entre login normal, Google y verificación 2FA
    function completarLogin(token, user) {
      sessionStorage.setItem('usuarioActual', JSON.stringify({
        token,
        id: user.id,
        usuario: user.usuario,
        email: user.email,
        rol: user.rol,
        nombre: user.nombre,
        nombre_completo: user.nombre_completo || user.nombre,
        obraId: user.obra_id || null,
        timestamp: new Date().toISOString()
      }));

      setMensaje(`Bienvenido, ${user.nombre_completo || user.nombre || user.usuario}`, 'success');

      setTimeout(() => {
        window.location.href = user.rol === 'admin' ? 'admin_dashboard.html' : 'index.html';
      }, 900);
    }

    async function handleLogin(event) {
      event.preventDefault();
      const btn = document.getElementById('btn-login');
      const usuario    = document.getElementById('usuario').value.trim();
      const contrasena = document.getElementById('contrasena').value;

      if (!usuario || !contrasena) {
        showErrorPopup('Por favor complete todos los campos');
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ Ingresando...';
      setMensaje('', '');

      try {
        const result = await API.auth.login(usuario, contrasena);

        if (result.mfaRequired) {
          window.__mfaToken = result.mfaToken;
          btn.disabled = false;
          btn.textContent = 'Ingresar';
          abrir2fa();
          return;
        }

        completarLogin(result.token, result.user);

      } catch (err) {
        showErrorPopup(err.message || 'Error al iniciar sesión');
        document.getElementById('contrasena').value = '';
        document.getElementById('contrasena').focus();
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    }

    // ── Google OAuth ─────────────────────────────────────────
    async function handleGoogleCredential(response) {
      const btn = document.getElementById('btn-google');
      btn.disabled = true;
      btn.innerHTML = btn.innerHTML.replace('Continuar con Google', '⏳ Verificando...');
      setMensaje('', '');

      try {
        const result = await API.auth.loginGoogle(response.credential);

        if (result.mfaRequired) {
          window.__mfaToken = result.mfaToken;
          btn.disabled = false;
          btn.innerHTML = btn.innerHTML.replace('⏳ Verificando...', 'Continuar con Google');
          abrir2fa();
          return;
        }

        completarLogin(result.token, result.user);
      } catch (err) {
        showErrorPopup(err.message || 'No autorizado con Google');
        btn.disabled = false;
        btn.innerHTML = btn.innerHTML.replace('⏳ Verificando...', 'Continuar con Google');
      }
    }

    function iniciarGoogleLogin() {
      const clientId = (window.CONFIG && CONFIG.GOOGLE_CLIENT_ID) || '';
      if (!clientId || clientId.startsWith('TU_')) {
        showErrorPopup('Google Client ID no configurado en config.js');
        return;
      }
      if (window.google && google.accounts) {
        google.accounts.id.prompt();
      }
    }

    // Attach login form
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm') || document.querySelector('form');
      if (form) form.addEventListener('submit', handleLogin);

      // Feature flag: ocultar login con Google
      if (window.CONFIG && CONFIG.FEATURES && !CONFIG.FEATURES.GOOGLE_LOGIN) {
        const googleSection = document.getElementById('google-login-section');
        if (googleSection) googleSection.style.display = 'none';
      }
    });

    /* ─── Forgot password ───────────────────────── */
    function abrirForgot() {
      document.getElementById('modal-forgot').classList.add('open');
      document.getElementById('forgot-email').value = '';
      document.getElementById('msg-forgot').textContent = '';
      document.getElementById('msg-forgot').className = '';
      document.getElementById('btn-forgot').disabled = false;
      document.getElementById('btn-forgot').textContent = 'Enviar enlace';
      setTimeout(() => document.getElementById('forgot-email').focus(), 50);
    }
    function cerrarForgot() {
      document.getElementById('modal-forgot').classList.remove('open');
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { cerrarForgot(); cerrarError(); cerrar2fa(); }
    });

    /* ─── Verificación en dos pasos (2FA) ───────── */
    let __mfaCountdownTimer = null;

    function abrir2fa() {
      document.getElementById('modal-2fa').classList.add('open');
      document.getElementById('codigo-2fa').value = '';
      document.getElementById('msg-2fa').textContent = '';
      document.getElementById('msg-2fa').className = '';
      document.getElementById('btn-verificar-2fa').disabled = false;
      document.getElementById('btn-verificar-2fa').textContent = 'Verificar';
      setTimeout(() => document.getElementById('codigo-2fa').focus(), 50);
      iniciarCountdown2fa();
    }
    function cerrar2fa() {
      document.getElementById('modal-2fa').classList.remove('open');
      if (__mfaCountdownTimer) clearInterval(__mfaCountdownTimer);
    }

    function iniciarCountdown2fa(segundos = 45) {
      const link = document.getElementById('btn-reenviar-2fa');
      if (__mfaCountdownTimer) clearInterval(__mfaCountdownTimer);

      let restante = segundos;
      link.style.pointerEvents = 'none';
      link.style.opacity = '0.5';
      link.textContent = `Reenviar código (${restante}s)`;

      __mfaCountdownTimer = setInterval(() => {
        restante--;
        if (restante <= 0) {
          clearInterval(__mfaCountdownTimer);
          link.style.pointerEvents = 'auto';
          link.style.opacity = '1';
          link.textContent = 'Reenviar código';
        } else {
          link.textContent = `Reenviar código (${restante}s)`;
        }
      }, 1000);
    }

    async function verificarCodigo2fa() {
      const codigo = document.getElementById('codigo-2fa').value.trim();
      const btn    = document.getElementById('btn-verificar-2fa');
      const msg    = document.getElementById('msg-2fa');

      if (!codigo || codigo.length !== 6) {
        msg.textContent = 'Ingresa el código de 6 dígitos.';
        msg.className = 'error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verificando...';
      msg.textContent = '';
      msg.className = '';

      try {
        const result = await API.auth.verify2fa(window.__mfaToken, codigo);
        cerrar2fa();
        completarLogin(result.token, result.user);
      } catch (err) {
        msg.textContent = err.message || 'Código inválido o expirado.';
        msg.className = 'error';
        btn.disabled = false;
        btn.textContent = 'Verificar';
      }
    }

    async function reenviarCodigo2fa() {
      const link = document.getElementById('btn-reenviar-2fa');
      if (link.style.pointerEvents === 'none') return; // aún en countdown

      const msg = document.getElementById('msg-2fa');
      msg.textContent = '';
      msg.className = '';

      try {
        const result = await API.auth.resend2fa(window.__mfaToken);
        window.__mfaToken = result.mfaToken;
        msg.textContent = 'Te enviamos un nuevo código.';
        msg.className = 'success';
        iniciarCountdown2fa();
      } catch (err) {
        msg.textContent = err.message || 'No se pudo reenviar el código.';
        msg.className = 'error';
      }
    }
    async function enviarForgot() {
      const email = document.getElementById('forgot-email').value.trim();
      const btn   = document.getElementById('btn-forgot');
      const msg   = document.getElementById('msg-forgot');
      if (!email) {
        msg.textContent = 'Por favor ingresa tu correo electrónico.';
        msg.className = 'error';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      msg.textContent = '';
      msg.className = '';
      try {
        const base = (window.CONFIG && CONFIG.API_BASE) || 'https://fl-snf-backend-production.up.railway.app/api';
        const res  = await fetch(`${base}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        // Manejar rate limit (429) y cualquier otro error del servidor
        if (!data.success) {
          msg.textContent = data.error || 'Error al procesar la solicitud. Intenta de nuevo.';
          msg.className = 'error';
          btn.disabled = false;
          btn.textContent = 'Enviar enlace';
          return;
        }
        msg.textContent = data.message || 'Si el correo está registrado, recibirás un enlace en breve.';
        msg.className = 'success';
        btn.textContent = '✓ Enviado';
      } catch {
        msg.textContent = 'Error al conectar con el servidor. Intenta de nuevo.';
        msg.className = 'error';
        btn.disabled = false;
        btn.textContent = 'Enviar enlace';
      }
    }

    /* ─── Slideshow ─────────────────────────────── */
    (function initSlideshow() {
      const slides = document.querySelectorAll('.slide');
      let current  = 0;
      if (slides.length < 2) return;
      setInterval(() => {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
      }, 5000);
    })();
  </script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Inicializar Google Identity Services después de que todos los scripts carguen
    window.addEventListener('load', () => {
      if (window.CONFIG && CONFIG.FEATURES && !CONFIG.FEATURES.GOOGLE_LOGIN) return;
      const clientId = (window.CONFIG && CONFIG.GOOGLE_CLIENT_ID) || '';
      if (!clientId || clientId.startsWith('TU_') || !window.google) return;
      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleGoogleCredential,
        ux_mode: 'popup'
      });
    });
  </script>
